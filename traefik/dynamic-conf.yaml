http:
  # Dashboard router with authentication
  routers:
    dashboard:
      rule: "Host(`${TRAEFIK_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      service: api@internal
      entryPoints:
        - websecure
      middlewares:
        - dashboard-auth
        - security-headers
      tls:
        certResolver: letsencrypt

  # Middlewares
  middlewares:
    # Basic authentication for dashboard
    dashboard-auth:
      basicAuth:
        users:
          - "${TRAEFIK_DASHBOARD_AUTH}"

    # Security headers
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 63072000
        customFrameOptionsValue: "SAMEORIGIN"
        customResponseHeaders:
          X-Robots-Tag: "noindex,nofollow,nosnippet,noarchive,notranslate,noimageindex"
          server: ""

    # HTTPS redirect middleware (for services that need it)
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

tls:
  # Modern TLS configuration
  options:
    modern:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - CurveP521
        - CurveP384
      sniStrict: true

  # Custom certificates (if provided)
  certificates:
    - certFile: /certs/${TRAEFIK_CUSTOM_CERT_FILE:-custom.crt}
      keyFile: /certs/${TRAEFIK_CUSTOM_KEY_FILE:-custom.key}
