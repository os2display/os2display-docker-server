networks:
  frontend:
    external: true
  proxy:
    driver: bridge
    internal: true

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env.traefik
        required: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - $PWD/traefik/ssl:/certs:ro
      - $PWD/traefik/letsencrypt:/letsencrypt
      - $PWD/traefik/traefik.yml:/traefik.yml:ro
      - $PWD/traefik/dynamic-conf-${TRAEFIK_CERT_PROVIDER:-letsencrypt}.yaml:/config/dynamic-conf.yaml:ro
    networks:
      - ${TRAEFIK_FRONTEND_NETWORK:-frontend}
      - proxy
    labels:
      - "traefik.enable=true"
      # Dashboard authentication
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth,security-headers@file"

  socket-proxy:
    image: itkdev/docker-socket-proxy
    user: root
    container_name: socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
    networks:
      - proxy
