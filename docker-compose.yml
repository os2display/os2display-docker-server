networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false
  proxy:
    driver: bridge
    internal: true

services:
  # OS2display Application Services
  api:
    image: turegjorup/display-api-service:${OS2DISPLAY_VERSION}
    restart: unless-stopped
    networks:
      - app
    depends_on:
      - redis
    env_file:
      - path: ./.env.local
        required: false
    volumes:
      - ./jwt:/var/www/html/config/jwt:rw
      - ./media:/var/www/html/public/media:rw

  nginx-api:
    image: turegjorup/display-api-service-nginx:${OS2DISPLAY_VERSION}
    restart: unless-stopped
    networks:
      - app
      - frontend
    depends_on:
      - api
    env_file:
      - path: ./.env.local
        required: false
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.apios2display-http.rule=Host(`${OS2DISPLAY_DOMAIN}`)"
      - "traefik.http.routers.apios2display-http.entrypoints=web"
      - "traefik.http.routers.apios2display-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.apios2display.rule=Host(`${OS2DISPLAY_DOMAIN}`)"
      - "traefik.http.routers.apios2display.entrypoints=websecure"
    volumes:
      - ./media:/var/www/html/public/media:rw
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: 'redis:8-alpine'
    restart: unless-stopped
    networks:
      - app
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # MariaDB Services
  mariadb:
    image: mariadb:10.11.11
    profiles:
      - mariadb
    restart: unless-stopped
    networks:
      - app
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE:-os2display}
      - MARIADB_USER=${MARIADB_USER:-os2display}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-os2display}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-os2display}
    volumes:
      - mariadb:/var/lib/mysql:rw

  # Traefik Services
  traefik:
    image: traefik:v3.6
    profiles:
      - traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env.traefik
        required: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - $PWD/traefik/ssl:/certs:ro
      - $PWD/traefik/letsencrypt:/letsencrypt
      - $PWD/traefik/traefik.yml:/traefik.yml:ro
      - $PWD/traefik/dynamic-conf-${SERVER_CERT_PROVIDER:-letsencrypt}.yaml:/config/dynamic-conf.yaml:ro
    networks:
      - ${SERVER_FRONTEND_NETWORK:-frontend}
      - proxy
    labels:
      - "traefik.enable=true"
      # Dashboard authentication
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${SERVER_DASHBOARD_AUTH}"
      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`${SERVER_DOMAIN}`) && PathPrefix(`/treafik/dashboard`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth,security-headers@file"

  socket-proxy:
    image: itkdev/docker-socket-proxy
    profiles:
      - traefik
    user: root
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
    networks:
      - proxy

volumes:
  redis-data:
  mariadb:
