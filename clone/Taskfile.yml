version: "3"
silent: true

# Standalone Taskfile for the stack-clone tooling. NOT included by the root
# Taskfile — invoke it explicitly. THIS checkout is the clone's DESTINATION;
# the operator points SOURCE at the running stack to clone. The scripts
# self-locate (they cd to the stack root holding this clone/ directory), so
# the current directory does not matter.
#
# Typical flow (run from a fresh checkout that will become the clone):
#   task -t clone/Taskfile.yml init      # create clone/.env.clone from example
#   $EDITOR clone/.env.clone             # set SOURCE / DOMAIN / CLONE_DATABASE_URL
#   task -t clone/Taskfile.yml clone     # repeatable — reuses clone/.env.clone
#
# Or just `cd clone && task <name>` (Task auto-discovers this Taskfile).
#
# Config lives in clone/.env.clone (gitignored). clone.sh loads it; variables
# set in the environment override the file for one-off runs.

vars:
  # Absolute path to this Taskfile's directory — used so the scripts resolve
  # regardless of the working directory the task is invoked from.
  DIR: "{{.TASKFILE_DIR}}"
  # docker compose invocation for the runnable v1 stack: the v1 compose file
  # lives in clone/, but --project-directory pins the project root (the stack
  # root holding this clone/ dir) so ./jwt and ./media resolve there, and
  # --env-file feeds compose the cloned v1 interpolation vars (COMPOSE_VERSION_*,
  # COMPOSE_SERVER_DOMAIN, COMPOSE_PROJECT_NAME, APP_*). COMPOSE_PROJECT_NAME in
  # that file sets the docker project name (router namespacing + network prefix).
  DC_V1: 'docker compose -f "{{.TASKFILE_DIR}}/compose.v1.yml" --project-directory "{{.TASKFILE_DIR}}/.." --env-file "{{.TASKFILE_DIR}}/../.env.docker.local"'

tasks:
  default:
    cmds:
      - task --list --taskfile "{{.TASKFILE}}"

  init:
    desc: Create clone/.env.clone from the example (edit it, then run `clone`)
    cmds:
      - |
        if [ -f "{{.DIR}}/.env.clone" ]; then
          echo "clone/.env.clone already exists — edit it, or delete it to re-init."
        else
          cp "{{.DIR}}/.env.clone.example" "{{.DIR}}/.env.clone"
          echo "Created clone/.env.clone — set SOURCE / DOMAIN / CLONE_DATABASE_URL, then run:"
          echo "  task -t clone/Taskfile.yml clone"
        fi

  create-db:
    desc: |
      Create the clone's database on the source's EXTERNAL database server
      (APP_DATABASE_URL — 1.x — or DATABASE_URL read from SOURCE/.env.local,
      .env.docker.local or .env.symfony, first found), grant the app user
      access, and write the
      resulting CLONE_DATABASE_URL into clone/.env.clone. Prompts for the
      DB admin (root) password. Override with CLONE_DB_NAME=… (default
      <source-db>_clone) and DB_ADMIN_USER=… (default root).
    cmds:
      - "{{.DIR}}/db-create.sh"

  clone:
    desc: |
      Make a faithful 1:1 copy of the v1 SOURCE install into this checkout
      (data + media + jwt + operator env, retargeted to DOMAIN and the clone
      DB) using clone/.env.clone. Does NOT convert to v3 — run env:migrate +
      app:update afterwards. Override a var inline for a one-off run, e.g.
      `DOMAIN=other.example.com task -t clone/Taskfile.yml clone`.
    cmds:
      - "{{.DIR}}/clone.sh"

  dump:
    desc: |
      Dump this stack's DATABASE_URL database to ./backup/<UTC-ts>.sql.gz
      (optional FILE=…; STACK_ROOT=… targets another stack root).
    cmds:
      - "{{.DIR}}/db-dump.sh {{.FILE}}"

  restore:
    desc: "Restore a dump into the DATABASE_URL database — FILE=backup/<ts>.sql.gz (DESTRUCTIVE)"
    requires:
      vars: [FILE]
    cmds:
      - "{{.DIR}}/db-restore.sh {{.FILE}}"

  v1:up:
    desc: |
      Boot the cloned v1 install in v1 MODE (same legacy itkdev images, cloned
      DB, new URL) via clone/compose.v1.yml — so you can verify it (log in, set
      up + authorize a screen) BEFORE converting to v3. Routed by the production
      Traefik on the external `frontend` network (override its name with
      FRONTEND_NETWORK=…). Run `clone` first. Convert with `v1:down` + env:migrate.
    preconditions:
      - sh: "[ -f '{{.DIR}}/../.env.docker.local' ]"
        msg: "No .env.docker.local in the stack root — run `clone` first."
    cmds:
      - "{{.DC_V1}} pull"
      - "{{.DC_V1}} up -d"
      - |
        env_file="{{.DIR}}/../.env.docker.local"
        domain=$(grep -E '^COMPOSE_SERVER_DOMAIN=' "$env_file" | cut -d= -f2- | tr -d '"')
        admin=$(grep -E '^COMPOSE_ADMIN_CLIENT_PATH=' "$env_file" | cut -d= -f2- | tr -d '"')
        echo "v1 clone up. Verify at https://${domain}${admin:-/admin}"

  v1:pull:
    desc: "Pull the v1 stack images named in the cloned .env.docker.local."
    cmds:
      - "{{.DC_V1}} pull"

  v1:down:
    desc: |
      Stop + remove the v1 clone stack (run this before converting to v3). The
      stack holds no named volumes, so the cloned DB (on the source's DB server),
      media and jwt are untouched.
    cmds:
      - "{{.DC_V1}} down"

  v1:logs:
    desc: "Tail the v1 clone stack logs (SERVICE=… to scope, e.g. SERVICE=api)."
    cmds:
      - "{{.DC_V1}} logs -f --tail=100 {{.SERVICE}}"

  v1:ps:
    desc: "Show the v1 clone stack's containers."
    cmds:
      - "{{.DC_V1}} ps"
