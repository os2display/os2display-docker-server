networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false

services:
  os2display:
    image: itkdev/os2display-api-service:${OS2DISPLAY_VERSION_API}
    restart: unless-stopped
    networks:
      - app
    env_file:
      - .env.local
    environment:
      - PHP_TIMEZONE=UTC
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-30}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-128M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-140M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-128M}
      - PHP_PM_MAX_CHILDREN=${PHP_PM_MAX_CHILDREN:-16}
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
    volumes:
      - ./jwt:/var/www/html/config/jwt:rw
      - ./media:/var/www/html/public/media:rw

  nginx-api:
    image: itkdev/os2display-api-service-nginx:${OS2DISPLAY_VERSION_API}
    restart: unless-stopped
    networks:
      - app
      - frontend
    environment:
      - PHP_FPM_SERVER=os2display
      - NGINX_FPM_UPLOAD_MAX=${NGINX_FPM_UPLOAD_MAX}
    depends_on:
      - os2display
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.apios2display-http.rule=Host(`${OS2DISPLAY_SERVER_DOMAIN}`)"
      - "traefik.http.routers.apios2display-http.entrypoints=web"
      - "traefik.http.routers.apios2display-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.apios2display.rule=Host(`${OS2DISPLAY_SERVER_DOMAIN}`)"
      - "traefik.http.routers.apios2display.entrypoints=websecure"
      # Redirect root / request to /${OS2DISPLAY_ADMIN_CLIENT_PATH}
      - "traefik.http.routers.apios2display.middlewares=redirect-to-admin"
      - "traefik.http.middlewares.redirect-to-admin.redirectregex.regex=^https:\\/\\/([^\\/]+)\\/?$$"
      - "traefik.http.middlewares.redirect-to-admin.redirectregex.replacement=https://$$1${OS2DISPLAY_ADMIN_CLIENT_PATH}"
      # - "traefik.http.routers.apios2display.middlewares=apios2display"
      # - "traefik.http.middlewares.apios2display.ipwhitelist.sourcerange=212.10.60.163, 10.225.0.0/16"
      # - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=ITKBasicAuth@file"
    volumes:
      - ./media:/var/www/html/public/media:rw

  admin:
    image: itkdev/os2display-admin-client:${OS2DISPLAY_VERSION_ADMIN}
    restart: unless-stopped
    networks:
      - app
      - frontend
    environment:
      - APP_ADMIN_CLIENT_PATH=${OS2DISPLAY_ADMIN_CLIENT_PATH}
      - API_PATH=${API_PATH}
      - APP_TOUCH_BUTTON_REGIONS=${APP_TOUCH_BUTTON_REGIONS}
      - APP_REJSEPLANEN_API_KEY=${APP_REJSEPLANEN_API_KEY}
      - APP_SHOW_SCREEN_STATUS=${APP_SHOW_SCREEN_STATUS}
      - APP_PREVIEW_CLIENT=${APP_PREVIEW_CLIENT}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.adminos2display-http.rule=Host(`${OS2DISPLAY_SERVER_DOMAIN}`) && PathPrefix(`${OS2DISPLAY_ADMIN_CLIENT_PATH}`)"
      - "traefik.http.routers.adminos2display-http.entrypoints=web"
      - "traefik.http.routers.adminos2display-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.adminos2display.rule=Host(`${OS2DISPLAY_SERVER_DOMAIN}`) && PathPrefix(`${OS2DISPLAY_ADMIN_CLIENT_PATH}`)"
      - "traefik.http.routers.adminos2display.entrypoints=websecure"
      # - "traefik.http.routers.adminos2display.middlewares=apios2display"
      # - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=ITKBasicAuth@file"

  client:
    image: itkdev/os2display-client:${OS2DISPLAY_VERSION_CLIENT}
    restart: unless-stopped
    networks:
      - app
      - frontend
    environment:
      - APP_SCREEN_CLIENT_PATH=${OS2DISPLAY_SCREEN_CLIENT_PATH:?err}
      - APP_API_ENDPOINT=${APP_API_ENDPOINT:?err}
      - APP_API_PATH=${APP_API_PATH:?err}
      - APP_API_AUTHENTICATION_ENDPOINT=${APP_API_AUTHENTICATION_ENDPOINT}
      - APP_API_AUTHENTICATION_REFRESH_ENDPOINT=${APP_API_AUTHENTICATION_REFRESH_ENDPOINT}
      - APP_DATA_PULL_INTERVAL=${APP_DATA_PULL_INTERVAL}
      - APP_SCHEDULING_INTERVAL=${APP_SCHEDULING_INTERVAL}
      - APP_DEBUG=${APP_DEBUG}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.clientos2display-http.rule=Host(`${OS2DISPLAY_SERVER_DOMAIN}`) && PathPrefix(`${OS2DISPLAY_SCREEN_CLIENT_PATH}`)"
      - "traefik.http.routers.clientos2display-http.entrypoints=web"
      - "traefik.http.routers.clientos2display-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.clientos2display.rule=Host(`${OS2DISPLAY_SERVER_DOMAIN}`) && PathPrefix(`${OS2DISPLAY_SCREEN_CLIENT_PATH}`)"
      - "traefik.http.routers.clientos2display.entrypoints=websecure"
      # - "traefik.http.routers.clientos2display.middlewares=apios2display"
      # - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=ITKBasicAuth@file"

  redis:
    image: 'redis:6'
    restart: unless-stopped
    networks:
      - app
