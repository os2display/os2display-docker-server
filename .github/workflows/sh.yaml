### ### Shell
###
### Lints shell scripts in `scripts/` via shellcheck.
###
### #### Assumptions
###
### 1. A docker compose service named `shellcheck` (gated behind the `dev`
###    profile) for running `koalaman/shellcheck` exists.

name: Shell

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create external `frontend` network
        run: docker network create frontend

      - name: Lint shell scripts
        run: docker compose --profile dev run --rm shellcheck scripts/*.sh
