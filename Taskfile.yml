version: '3'
silent: true

vars:
  COMPOSE: docker compose --env-file .env --env-file .env.traefik

tasks:
  default:
    desc: The default task that shows help
    cmds:
      - echo "Available tasks (in preferred order):"
      - echo "  install         Install the project"
      - echo "  reinstall       Reinstall from scratch. WARNING Deletes the database!"
      - echo "  update          Pull updated images, recreate containers, run migrations"
      - echo "  up              Start the environment"
      - echo "  down            Remove all containers"
      - echo "  purge           Remove all containers and volumes. WARNING Deletes the database!"
      - echo "  stop            Stop all containers"
      - echo "  logs            Follow docker logs"
      - echo "  cc              Clear the cache"
      - echo "  tenant_add      Add a new tenant group"
      - echo "  user_add        Add a new user"
      - echo "  load_templates  Load templates and screen layouts"
      - echo "  traefik_env     Setup .env.traefik (domain, email, dashboard auth)"
      - echo ""

  install:
    desc: Install the project
    preconditions:
      - sh: '[ -f .env ]'
        msg: ".env missing — copy .env.example to .env, edit it, then re-run."
      - sh: '[ -f .env.local ]'
        msg: ".env.local missing — copy .env.local.example to .env.local, edit it, then re-run."
    deps:
      - _env_files
    cmds:
      - echo "Installing"
      - |
        # Check if the external network 'frontend' exists, create if not
        if ! docker network ls --format '{{`{{.Name}}`}}' | grep -wq frontend; then
          echo "Creating external network 'frontend'"
          docker network create frontend
        else
          echo "External network 'frontend' already exists"
        fi
      - "{{.COMPOSE}} pull"
      - "{{.COMPOSE}} up --force-recreate --detach --remove-orphans"
      - echo "Waiting for database to be ready"
      - sleep 20
      - echo "Initialize the database"
      - "{{.COMPOSE}} exec os2display bin/console doctrine:schema:create"
      - echo "Clearing the cache"
      - task cc
      - echo "Create jwt key pair"
      - "{{.COMPOSE}} exec os2display bin/console lexik:jwt:generate-keypair --skip-if-exists"
      - task tenant_add
      - echo "CREATE AN ADMIN USER. CHOOSE THE TENANT YOU JUST CREATED."
      - task user_add
      - task load_templates
      - task _show_notes

  traefik_env:
    desc: Setup .env.traefik (domain, email, dashboard auth)
    cmds:
      - |
        if [ ! -f .env.traefik ]; then
          echo ".env.traefik does not exist. Copying .env.traefik.example to .env.traefik..."
          cp .env.traefik.example .env.traefik
        fi

        # Ensure htpasswd is installed
        if ! command -v htpasswd >/dev/null 2>&1; then
          echo "Error: 'htpasswd' command not found."
          echo "Please install it (usually from the 'apache2-utils' or 'httpd-tools' package) and try again."
          exit 1
        fi

        echo ""

        echo "Configure Traefik environment"
        echo "===================================================="
        printf "Enter server domain (e.g. example.com): "
        read SERVER_DOMAIN
        printf "Enter email for Let's Encrypt (e.g. admin@example.com): "
        read TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL
        printf "Enter Traefik dashboard/admin username: "
        read SERVER_DASHBOARD_USERNAME
        printf "Enter Traefik dashboard/admin password: "
        read -s SERVER_DASHBOARD_PASSWORD

        # Generate htpasswd entry (username:hash)
        HTPASSWD_RAW=$(htpasswd -nb "${SERVER_DASHBOARD_USERNAME}" "${SERVER_DASHBOARD_PASSWORD}")

        # Escape characters that break sed/env ($, /, &)
        HTPASSWD_ESCAPED=$(printf '%s\n' "$HTPASSWD_RAW" \
          | sed -e 's/[\/&]/\\&/g' -e 's/\$/\\$/g')

        # Update variables in .env.traefik
        sed -i "s/^SERVER_DOMAIN=.*/SERVER_DOMAIN=${SERVER_DOMAIN}/" .env.traefik
        sed -i "s/^TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=.*/TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL}/" .env.traefik
        sed -i "s/^SERVER_DASHBOARD_AUTH=.*/SERVER_DASHBOARD_AUTH=${HTPASSWD_ESCAPED}/" .env.traefik

        echo "===================================================="
        echo ".env.traefik has been updated."
        echo "Domain:   ${SERVER_DOMAIN}"
        echo "Email:    ${TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL}"
        echo "User:     ${SERVER_DASHBOARD_USERNAME}"
        echo "Password: (hidden)"
        echo "Auth:     (htpasswd line stored in SERVER_DASHBOARD_AUTH)"
        echo "===================================================="

  reinstall:
    desc: Reinstall from scratch. Removes the database, all containers, and volumes.
    deps:
      - purge
    cmds:
      - task install

  update:
    desc: Pull updated images, recreate containers, run database migrations
    deps:
      - _env_files
    cmds:
      - "{{.COMPOSE}} pull"
      - "{{.COMPOSE}} up --force-recreate --detach --remove-orphans"
      - "{{.COMPOSE}} exec --user deploy os2display bin/console doctrine:migrations:migrate --no-interaction"
      - echo "NB! Remember to load templates if they have changed (task load_templates)."

  down:
    desc: Remove all containers
    deps:
      - stop
    cmds:
      - "{{.COMPOSE}} down"

  purge:
    desc: Remove all containers and volumes
    deps:
      - stop
    cmds:
      - "{{.COMPOSE}} down --volumes --remove-orphans"
      - |
        # Check if the external network 'frontend' exists, remove if it does
        if docker network ls --format '{{`{{.Name}}`}}' | grep -wq frontend; then
          echo "Removing external network 'frontend'"
          docker network rm frontend
        else
          echo "External network 'frontend' does not exist"
        fi

  up:
    desc: Take the environment up without altering the existing state of the containers
    deps:
      - _env_files
    cmds:
      - "{{.COMPOSE}} up -d"

  stop:
    desc: Stop all containers without altering anything else
    cmds:
      - "{{.COMPOSE}} stop"

  tenant_add:
    desc: Add a new tenant group
    cmds:
      - echo ""
      - echo "Add a tenant"
      - echo "===================================================="
      - echo "A tenant is a group of users that share the same configuration. F. ex. IT, Library, Schools etc."
      - echo "You have to provide tenant id, tenant title and optionally a description."
      - echo "===================================================="
      - echo ""
      - "{{.COMPOSE}} exec -T os2display bin/console app:tenant:add"

  user_add:
    desc: Add a new user (editor or admin)
    cmds:
      - echo ""
      - echo "Add a user"
      - echo "===================================================="
      - echo "You have to provide email, password, full name, role (editor or admin) and the tenant id."
      - echo "===================================================="
      - echo ""
      - "{{.COMPOSE}} exec -T os2display bin/console app:user:add"

  load_templates:
    desc: Load templates and screen layouts
    cmds:
      - |
        TEMPLATES_RELEASE=$(grep ^TASK_VERSION_TEMPLATES= .env | cut -d '=' -f 2)
        TEMPLATES=$(grep ^TASK_TEMPLATES= .env | cut -d '=' -f 2 | tr -d ' "' | tr ',' ' ')
        if [ -z "$TEMPLATES_RELEASE" ]; then
          echo "Error: TASK_VERSION_TEMPLATES is not set in .env"
          exit 1
        fi
        if [ -z "$TEMPLATES" ]; then
          echo "Error: TASK_TEMPLATES is not set or empty in .env"
          exit 1
        fi
        echo "Using TEMPLATES_RELEASE=$TEMPLATES_RELEASE"
        echo "Using TEMPLATES=$TEMPLATES"
        for TEMPLATE in $TEMPLATES; do
          if [ "$TEMPLATES_RELEASE" = "develop" ]; then
            CONFIG_URL="https://raw.githubusercontent.com/os2display/display-templates/refs/heads/$TEMPLATES_RELEASE/build/$TEMPLATE-config-main.json"
          else
            CONFIG_URL="https://raw.githubusercontent.com/os2display/display-templates/refs/tags/$TEMPLATES_RELEASE/build/$TEMPLATE-config-main.json"
          fi
          echo "Loading template: $TEMPLATE"
          {{.COMPOSE}} exec --user deploy os2display bin/console app:template:load -p $CONFIG_URL
        done

        SCREEN_LAYOUTS=$(grep ^TASK_SCREEN_LAYOUTS= .env | cut -d '=' -f 2 | tr -d ' "' | tr ',' ' ')
        if [ -z "$SCREEN_LAYOUTS" ]; then
          echo "Error: TASK_SCREEN_LAYOUTS is not set or empty in .env"
          exit 1
        fi
        echo "Using SCREEN_LAYOUTS=$SCREEN_LAYOUTS"
        for SCREEN_LAYOUT in $SCREEN_LAYOUTS; do
          if [ "$TEMPLATES_RELEASE" = "develop" ]; then
            CONFIG_URL="https://raw.githubusercontent.com/os2display/display-templates/refs/heads/$TEMPLATES_RELEASE/src/screen-layouts/$SCREEN_LAYOUT.json"
          else
            CONFIG_URL="https://raw.githubusercontent.com/os2display/display-templates/refs/tags/$TEMPLATES_RELEASE/src/screen-layouts/$SCREEN_LAYOUT.json"
          fi
          echo "Loading screen layout: $SCREEN_LAYOUT"
          {{.COMPOSE}} exec --user deploy os2display bin/console app:screen-layouts:load --update --cleanup-regions $CONFIG_URL
        done

  logs:
    desc: Follow docker logs from the containers
    cmds:
      - "{{.COMPOSE}} logs -f --tail=50"

  cc:
    desc: Clear the cache
    cmds:
      - "{{.COMPOSE}} exec os2display bin/console cache:clear"

  _show_notes:
    cmds:
      - |
        DOMAIN=$(grep ^OS2DISPLAY_SERVER_DOMAIN= .env | cut -d '=' -f 2)
        echo ""
        echo "===================================================="
        echo "OS2display now is available via the URLs below"
        echo "===================================================="
        echo "Admin: https://$DOMAIN/admin"
        echo "Screen: https://$DOMAIN/client"
        echo "===================================================="

  _env_files:
    cmds:
      - |
        if [ ! -f .env.traefik ]; then
          echo ".env.traefik does not exist. Copying .env.traefik.example to .env.traefik..."
          cp .env.traefik.example .env.traefik
        fi
