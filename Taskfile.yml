version: "3"
silent: true

vars:
  COMPOSE: docker compose --env-file .env --env-file .env.traefik

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # -- Lifecycle --------------------------------------------------------------

  install:
    desc: Install the project — first-time setup, interactive (tenant + admin user)
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env missing — copy .env.example to .env, edit it, then re-run."
      - sh: "[ -f .env.symfony ]"
        msg: ".env.symfony missing — run 'task env:init' to bootstrap from the API image, edit it, then re-run."
    deps:
      - bootstrap-env-files
    cmds:
      - echo "Installing"
      - "{{.COMPOSE}} pull"
      - "{{.COMPOSE}} up --force-recreate --detach --remove-orphans"
      - echo "Waiting for database to be ready"
      - sleep 20
      - echo "Run database migrations and required updates"
      - task: console
        vars: { CLI_ARGS: "app:update" }
      - echo "Clearing the cache"
      - task: cache:clear
      - echo "Create jwt key pair"
      - task: console
        vars: { CLI_ARGS: "lexik:jwt:generate-keypair --skip-if-exists" }
      - task: tenant:add
      - echo "CREATE AN ADMIN USER. CHOOSE THE TENANT YOU JUST CREATED."
      - task: user:add
      - task: templates:install
      - task: show-notes

  update:
    desc: Pull updated images, recreate containers, run app:update (Doctrine migrations + cache:warmup)
    deps:
      - bootstrap-env-files
    cmds:
      - "{{.COMPOSE}} pull"
      - "{{.COMPOSE}} up --force-recreate --detach --remove-orphans"
      - task: console
        vars: { EXEC_FLAGS: "--user deploy", CLI_ARGS: "app:update" }
      - echo "NB! Run 'task templates:install' if the new image added templates."

  up:
    desc: Start the stack without recreating containers
    deps:
      - bootstrap-env-files
    cmds:
      - "{{.COMPOSE}} up -d"

  down:
    desc: Remove all containers (preserves named volumes)
    deps:
      - stop
    cmds:
      - "{{.COMPOSE}} down"

  stop:
    desc: Stop all containers without altering anything else
    cmds:
      - "{{.COMPOSE}} stop"

  purge:
    desc: Remove all containers AND named volumes. WIPES the database!
    prompt: |
      This will remove all containers AND named volumes — the bundled MariaDB
      database and the Redis cache will be DELETED. Bind mounts (./media,
      ./jwt, traefik/letsencrypt) are preserved. Continue?
    deps:
      - stop
    cmds:
      - "{{.COMPOSE}} down --volumes --remove-orphans"

  reinstall:
    desc: Reinstall from scratch — purges all data, then installs
    prompt: |
      This is `task purge` followed by `task install`. ALL DATA in the bundled
      MariaDB is DELETED; the Redis cache is rebuilt. Bind mounts (./media,
      ./jwt) are preserved, but operator-edited env files MUST already be
      configured (.env, .env.symfony, .env.<service>). Continue?
    cmds:
      - task: stop
      - "{{.COMPOSE}} down --volumes --remove-orphans"
      - task: install

  # -- Operations -------------------------------------------------------------

  logs:follow:
    desc: "Follow service logs (vars: S=<service> lines=<n>; defaults: all services, 100 lines)"
    aliases: [logs]
    # Note: defaults applied via the `default` template filter, NOT a `vars:`
    # block. Taskfile v3 lets task-local vars block CLI overrides — declaring
    # `vars: { S: "" }` here would make `task logs S=traefik` silently no-op.
    cmds:
      - '{{.COMPOSE}} logs -f --tail={{.lines | default "100"}} {{.S | default ""}}'

  logs:since:
    desc: "Print logs since a duration without following (vars: T=<duration> S=<service>; e.g. T=1h S=os2display)"
    cmds:
      - '{{.COMPOSE}} logs --since={{.T | default "1h"}} {{.S | default ""}}'

  logs:errors:
    desc: Surface error/critical/fatal/exception lines across all services in the last hour
    cmds:
      - "{{.COMPOSE}} logs --since=1h --no-color | grep -iE '\\b(error|critical|emerg|fatal|exception|stacktrace)\\b' || true"

  logs:access:
    desc: Tail traefik's JSON access log, projected to a compact line per request
    cmds:
      - "{{.COMPOSE}} logs -f traefik 2>&1 | grep -E '^\\{' | jq -c '{ts:.StartUTC, host:.RequestHost, path:.RequestPath, status:.DownstreamStatus, dur_ms:(.Duration/1000000)}'"

  logs:disk:
    desc: |
      Show docker log disk usage per container in this compose project, plus
      the effective LOG_MAX_SIZE / LOG_MAX_FILE retention policy. Linux only
      (the json-file logs at /var/lib/docker are root-owned, so reads happen
      via a transient alpine container with a read-only mount).
    cmds:
      - ./scripts/logs-disk.sh

  console:
    desc: "Run a Symfony bin/console command in the os2display container — e.g. `task console -- list`"
    vars:
      EXEC_FLAGS: ""
    cmds:
      - "{{.COMPOSE}} exec {{if .EXEC_FLAGS}}{{.EXEC_FLAGS}} {{end}}os2display bin/console {{.CLI_ARGS}}"

  cache:clear:
    desc: Clear the application cache
    aliases: [cc]
    cmds:
      - task: console
        vars: { CLI_ARGS: "cache:clear" }

  tenant:add:
    desc: Add a new tenant group (interactive)
    aliases: [tenant_add]
    cmds:
      - echo ""
      - echo "Add a tenant"
      - echo "===================================================="
      - echo "A tenant is a group of users that share the same configuration. F. ex. IT, Library, Schools etc."
      - echo "You have to provide tenant id, tenant title and optionally a description."
      - echo "===================================================="
      - echo ""
      - task: console
        vars: { EXEC_FLAGS: "-T", CLI_ARGS: "app:tenant:add" }

  user:add:
    desc: Add a new user — editor or admin (interactive)
    aliases: [user_add]
    cmds:
      - echo ""
      - echo "Add a user"
      - echo "===================================================="
      - echo "You have to provide email, password, full name, role (editor or admin) and the tenant id."
      - echo "===================================================="
      - echo ""
      - task: console
        vars: { EXEC_FLAGS: "-T", CLI_ARGS: "app:user:add" }

  templates:install:
    desc: Install bundled templates and screen layouts (--all --update)
    aliases: [load_templates]
    cmds:
      - task: console
        vars:
          {
            EXEC_FLAGS: "--user deploy",
            CLI_ARGS: "app:templates:install --all --update",
          }
      - task: console
        vars:
          {
            EXEC_FLAGS: "--user deploy",
            CLI_ARGS: "app:screen-layouts:install --all --update --cleanupRegions",
          }

  # -- Env-file bootstrap & tooling -------------------------------------------

  env:init:
    desc: Bootstrap .env.symfony from the API image
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env missing — copy .env.example to .env first."
      - sh: '! [ -f .env.symfony ] || [ "${FORCE:-0}" = "1" ]'
        msg: ".env.symfony already exists. Use 'task env:diff' to compare, or set FORCE=1 to overwrite."
    cmds:
      - |
        VERSION=$(grep ^OS2DISPLAY_VERSION_API= .env | cut -d= -f2)
        IMAGE="ghcr.io/os2display/display-api-service:${VERSION}"
        docker pull "$IMAGE"
        docker run --rm --entrypoint sh "$IMAGE" -c 'cat /app/.env' > .env.symfony
        echo ".env.symfony created from $IMAGE."
        echo "Edit it to set APP_SECRET, JWT_PASSPHRASE, DATABASE_URL, plus any ADMIN_* / CLIENT_* / OIDC_* overrides."
        echo "Then run 'task install'."

  env:diff:
    desc: Compare .env.symfony against the example shipped in the current API image
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env missing — copy .env.example to .env first."
      - sh: "[ -f .env.symfony ]"
        msg: ".env.symfony missing — run 'task env:init' first."
    cmds:
      - |
        VERSION=$(grep ^OS2DISPLAY_VERSION_API= .env | cut -d= -f2)
        IMAGE="ghcr.io/os2display/display-api-service:${VERSION}"
        tmp=$(mktemp)
        docker run --rm --entrypoint sh "$IMAGE" -c 'cat /app/.env' > "$tmp"
        diff -u .env.symfony "$tmp" || true
        rm -f "$tmp"

  env:migrate:
    desc: Convert a 1.x .env.docker.local into a 3.x-shaped .env.symfony.migrated
    cmds:
      - |
        if [ -f .env.docker.local ]; then
          SRC=.env.docker.local
        elif [ -f .env.local ]; then
          SRC=.env.local
        else
          echo "Error: neither .env.docker.local nor .env.local exists."
          exit 1
        fi
        OUT=.env.symfony.migrated
        # Strip APP_ prefix from every key except APP_ENV and APP_SECRET (those stay).
        sed -E '/^APP_(ENV|SECRET)=/!s/^APP_([A-Z_][A-Z0-9_]*=)/\1/' "$SRC" > "$OUT"
        echo "Wrote $OUT (from $SRC)."
        echo "Review with: diff -u $SRC $OUT"
        echo "Apply with:  mv $OUT .env.symfony"
        echo ""
        echo "Note: this only contains Symfony app config. PHP_*, NGINX_*, MARIADB_*"
        echo "values from your old .env.docker.local belong in .env.php, .env.nginx,"
        echo "and .env.mariadb respectively — copy from the .production.example files"
        echo "and edit per your deployment."

  env:traefik:
    desc: Setup .env.traefik (domain, email, dashboard auth) — interactive
    aliases: [traefik_env]
    cmds:
      - ./scripts/env-traefik.sh

  # -- Host inspection -------------------------------------------------------

  host:resources:
    desc: |
      Linux-only. Print a recommended compose override with mem_limit values
      for every service, derived from the host's CPU+RAM. Capture stdout to
      compose.resource-limits.yml and opt in via COMPOSE_FILE in .env.
      Assumes a DEDICATED host — scale down for shared hosts.
    cmds:
      - ./scripts/host-resources.sh

  host:php:
    desc: |
      Recommend PHP-FPM settings (pm.max_children, opcache memory, etc.) for
      a given os2display container mem_limit. Pass the limit in MiB after `--`:
          task host:php -- 256       # tight ceiling
          task host:php -- 1024      # comfortable mid-size
          task host:php -- 4096      # large
      Output: a block of PHP_* env-var assignments to merge into .env.php.
    cmds:
      - ./scripts/host-php.sh {{.CLI_ARGS}}

  host:disk:
    desc: Show stack disk usage (bind mounts + named volumes) vs host disk available
    cmds:
      - |
        echo "Bind mounts:"
        for path in ./media ./jwt ./backup; do
          if [ -d "$path" ]; then
            printf "  %-12s %s\n" "$path" "$(du -sh "$path" 2>/dev/null | cut -f1)"
          fi
        done
        echo
        echo "Named volumes:"
        PROJECT=$(grep ^COMPOSE_PROJECT_NAME= .env 2>/dev/null | cut -d= -f2-)
        PROJECT="${PROJECT:-os2display}"
        docker system df -v 2>/dev/null \
          | awk -v p="^${PROJECT}_(mariadb|redis-data)" '$1 ~ p {printf "  %-30s %s\n", $1, $3}'
        echo
        echo "Host filesystem (project mount point):"
        df -h . | tail -1 | awk '{
          printf "  Total: %s   Used: %s   Available: %s   (%s used)\n", $2, $3, $4, $5
        }'

  host:disk:tenants:
    desc: |
      Show ./media disk usage broken down by tenant. The v3 image's Vich
      uploader stores each tenant's uploads at ./media/<tenantKey>/, so the
      subdirectory names are the tenant keys.
    cmds:
      - |
        if [ ! -d ./media ] || [ -z "$(ls -A ./media 2>/dev/null)" ]; then
          echo "./media is empty or missing."
          exit 0
        fi
        echo "./media usage by tenant:"
        # Two-column output: <size>  <tenant-key>, sorted by size desc.
        # `du -sh` prints `<size>\t<path>`. We strip the trailing slash and
        # the leading ./media/ prefix to surface just the tenant key.
        du -sh ./media/*/ 2>/dev/null \
          | sort -hr \
          | awk -F'\t' '{
              path = $2
              sub(/\/$/, "", path)
              sub(/^\.\/media\//, "", path)
              printf "  %-30s %s\n", path, $1
            }'
        echo "  ----"
        printf "  %-30s %s\n" "TOTAL" "$(du -sh ./media 2>/dev/null | cut -f1)"

  # -- Database ---------------------------------------------------------------

  db:backup:
    desc: Dump the bundled MariaDB to ./backup/<UTC-timestamp>.sql.gz (online, --single-transaction)
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env missing — copy .env.example to .env first."
      - sh: "[ -f .env.mariadb ]"
        msg: ".env.mariadb missing — copy .env.mariadb.production.example to .env.mariadb first."
    cmds:
      - mkdir -p backup
      - |
        ROOT_PASSWORD=$(grep ^MARIADB_ROOT_PASSWORD= .env.mariadb | cut -d= -f2-)
        if [ -z "$ROOT_PASSWORD" ]; then
          echo "Error: MARIADB_ROOT_PASSWORD is empty in .env.mariadb"
          exit 1
        fi
        TS=$(date -u +%Y%m%dT%H%M%SZ)
        OUT="backup/${TS}.sql.gz"
        echo "Dumping all databases to $OUT (--single-transaction, no service downtime)..."
        {{.COMPOSE}} exec -T mariadb mariadb-dump \
          --all-databases --single-transaction --quick --routines --triggers --events \
          --user=root --password="$ROOT_PASSWORD" \
          | gzip > "$OUT"
        echo "Wrote $OUT ($(du -h "$OUT" | cut -f1))."

  db:upgrade:
    desc: Run mariadb-upgrade against the bundled MariaDB (idempotent; run after a major version bump)
    preconditions:
      - sh: "[ -f .env.mariadb ]"
        msg: ".env.mariadb missing — copy .env.mariadb.production.example to .env.mariadb first."
    cmds:
      - |
        ROOT_PASSWORD=$(grep ^MARIADB_ROOT_PASSWORD= .env.mariadb | cut -d= -f2-)
        if [ -z "$ROOT_PASSWORD" ]; then
          echo "Error: MARIADB_ROOT_PASSWORD is empty in .env.mariadb"
          exit 1
        fi
        {{.COMPOSE}} exec -T mariadb mariadb-upgrade --user=root --password="$ROOT_PASSWORD"

  # -- Dev tooling ------------------------------------------------------------

  dev:lint:
    desc: Run all linters in check mode (Markdown + YAML + Shell)
    deps:
      - dev:lint:md
      - dev:lint:yaml
      - dev:lint:sh

  dev:lint:fix:
    desc: Auto-fix all lint issues (Markdown + YAML; shellcheck has no fix mode)
    deps:
      - dev:lint:md:fix
      - dev:lint:yaml:fix

  dev:lint:md:
    desc: Lint Markdown files
    cmds:
      - docker compose --profile dev run --rm markdownlint markdownlint '**/*.md'

  dev:lint:md:fix:
    desc: Auto-fix Markdown lint issues (markdownlint --fix)
    cmds:
      - docker compose --profile dev run --rm markdownlint markdownlint --fix '**/*.md'

  dev:lint:yaml:
    desc: Lint YAML files (Prettier --check)
    cmds:
      - docker compose --profile dev run --rm prettier '**/*.{yml,yaml}' --check

  dev:lint:yaml:fix:
    desc: Auto-fix YAML formatting (Prettier --write)
    cmds:
      - docker compose --profile dev run --rm prettier '**/*.{yml,yaml}' --write

  dev:lint:sh:
    desc: Lint shell scripts in scripts/ via shellcheck (read-only; no auto-fix)
    cmds:
      - docker compose --profile dev run --rm shellcheck scripts/*.sh

  # -- Internal ---------------------------------------------------------------

  show-notes:
    internal: true
    cmds:
      - |
        DOMAIN=$(grep ^OS2DISPLAY_SERVER_DOMAIN= .env | cut -d '=' -f 2)
        echo ""
        echo "===================================================="
        echo "OS2display now is available via the URLs below"
        echo "===================================================="
        echo "Admin: https://$DOMAIN/admin"
        echo "Screen: https://$DOMAIN/client"
        echo "===================================================="

  bootstrap-env-files:
    internal: true
    cmds:
      - |
        # Per-service env files bootstrap from their canonical .production.example
        # template if not yet edited by the operator. .env.symfony is image-
        # bootstrapped by `task env:init` and is not auto-created here.
        for svc in php nginx mariadb traefik; do
          if [ ! -f ".env.$svc" ]; then
            echo ".env.$svc does not exist. Copying .env.$svc.production.example to .env.$svc..."
            cp ".env.$svc.production.example" ".env.$svc"
          fi
        done
