version: "3"
silent: true

# Load orchestration env files so tasks (and the scripts they call) can
# reference values directly via `$VAR` / `{{.VAR}}` instead of grepping the
# files. Missing files are silently ignored — fresh checkouts work fine
# until `task env:init` creates them. We deliberately do NOT load
# `.env.symfony`: exposing `APP_SECRET` / `JWT_PASSPHRASE` / OAuth tokens
# to every subshell would be more surface than the convenience justifies.
dotenv: [".env", ".env.mariadb", ".env.traefik"]

vars:
  COMPOSE: docker compose --env-file .env --env-file .env.traefik

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # -- Lifecycle --------------------------------------------------------------

  install:
    desc: Install the project — first-time setup, interactive (tenant + admin user)
    preconditions:
      - sh: "[ -f .env.symfony ]"
        msg: ".env.symfony missing — run 'task env:init' first to bootstrap all env files."
      # File-truth instead of env-snapshot: Task's `dotenv:` loads
      # .env.traefik once at startup and won't override the var if it
      # was already exported (godotenv preserves existing env). Chained
      # callers like `task dev:install` mutate .env.traefik mid-run, so
      # checking the file directly is the only reliable gate.
      - sh: '[ -f .env.traefik ] && ! grep -qE "^SERVER_DASHBOARD_AUTH=CHANGE_ME$" .env.traefik'
        msg: "Traefik dashboard auth not set — run 'task env:traefik' (or 'task dev:env' for localhost dev) first."
    cmds:
      - echo "Installing"
      - ./scripts/install-secrets.sh
      - "{{.COMPOSE}} pull"
      - "{{.COMPOSE}} up --force-recreate --detach --remove-orphans --wait"
      - echo "Run database migrations and required updates"
      - task: console
        vars: { CLI_ARGS: "app:update" }
      - echo "Clearing the cache"
      - task: cache:clear
      - echo "Create jwt key pair"
      - task: console
        vars: { CLI_ARGS: "lexik:jwt:generate-keypair --skip-if-exists" }
      - task: tenant:add
      - echo "CREATE AN ADMIN USER. CHOOSE THE TENANT YOU JUST CREATED."
      - task: user:add
      - task: templates:install
      - task: show-notes

  update:
    desc: Pull updated images, recreate containers, run app:update (Doctrine migrations + cache:warmup)
    preconditions:
      - sh: "[ -f .env.symfony ]"
        msg: ".env.symfony missing — run 'task env:init' first."
    cmds:
      - "{{.COMPOSE}} pull"
      - "{{.COMPOSE}} up --force-recreate --detach --remove-orphans --wait"
      - task: console
        vars: { EXEC_FLAGS: "--user deploy", CLI_ARGS: "app:update" }
      - echo "NB! Run 'task templates:install' if the new image added templates."

  up:
    desc: Start the stack without recreating containers; blocks until healthchecks pass
    preconditions:
      - sh: "[ -f .env.symfony ]"
        msg: ".env.symfony missing — run 'task env:init' first."
    cmds:
      - "{{.COMPOSE}} up -d --wait"

  down:
    desc: Remove all containers (preserves named volumes)
    deps:
      - stop
    cmds:
      - "{{.COMPOSE}} down"

  stop:
    desc: Stop all containers without altering anything else
    cmds:
      - "{{.COMPOSE}} stop"

  purge:
    desc: Remove all containers AND named volumes. WIPES the database!
    prompt: |
      This will remove all containers AND named volumes — the bundled MariaDB
      database and the Redis cache will be DELETED. Bind mounts (./media,
      ./jwt, traefik/letsencrypt) are preserved. Continue?
    deps:
      - stop
    cmds:
      - "{{.COMPOSE}} down --volumes --remove-orphans"

  reinstall:
    desc: Reinstall from scratch — purges all data, then installs
    prompt: |
      This is `task purge` followed by `task install`. ALL DATA in the bundled
      MariaDB is DELETED; the Redis cache is rebuilt. Bind mounts (./media,
      ./jwt) are preserved, but operator-edited env files MUST already be
      configured (.env, .env.symfony, .env.<service>). Continue?
    cmds:
      - task: stop
      - "{{.COMPOSE}} down --volumes --remove-orphans"
      - task: install

  # -- Operations -------------------------------------------------------------

  logs:follow:
    desc: "Follow service logs (vars: S=<service> lines=<n>; defaults: all services, 100 lines)"
    aliases: [logs]
    # Note: defaults applied via the `default` template filter, NOT a `vars:`
    # block. Taskfile v3 lets task-local vars block CLI overrides — declaring
    # `vars: { S: "" }` here would make `task logs S=traefik` silently no-op.
    cmds:
      - '{{.COMPOSE}} logs -f --tail={{.lines | default "100"}} {{.S | default ""}}'

  logs:since:
    desc: "Print logs since a duration without following (vars: T=<duration> S=<service>; e.g. T=1h S=os2display)"
    cmds:
      - '{{.COMPOSE}} logs --since={{.T | default "1h"}} {{.S | default ""}}'

  logs:errors:
    desc: Surface error/critical/fatal/exception lines across all services in the last hour
    cmds:
      - "{{.COMPOSE}} logs --since=1h --no-color | grep -iE '\\b(error|critical|emerg|fatal|exception|stacktrace)\\b' || true"

  logs:access:
    desc: Tail traefik's JSON access log, projected to a compact line per request
    cmds:
      - "{{.COMPOSE}} logs -f traefik 2>&1 | grep -E '^\\{' | jq -c '{ts:.StartUTC, host:.RequestHost, path:.RequestPath, status:.DownstreamStatus, dur_ms:(.Duration/1000000)}'"

  logs:disk:
    desc: |
      Show docker log disk usage per container in this compose project, plus
      the effective LOG_MAX_SIZE / LOG_MAX_FILE retention policy. Linux only
      (the json-file logs at /var/lib/docker are root-owned, so reads happen
      via a transient alpine container with a read-only mount).
    cmds:
      - ./scripts/logs-disk.sh

  console:
    desc: "Run a Symfony bin/console command in the os2display container — e.g. `task console -- list`"
    vars:
      EXEC_FLAGS: ""
    cmds:
      - "{{.COMPOSE}} exec {{if .EXEC_FLAGS}}{{.EXEC_FLAGS}} {{end}}os2display bin/console {{.CLI_ARGS}}"

  cache:clear:
    desc: Clear the application cache
    aliases: [cc]
    cmds:
      - task: console
        vars: { CLI_ARGS: "cache:clear" }

  tenant:add:
    desc: Add a new tenant group (interactive)
    aliases: [tenant_add]
    cmds:
      - echo ""
      - echo "Add a tenant"
      - echo "===================================================="
      - echo "A tenant is a group of users that share the same configuration. F. ex. IT, Library, Schools etc."
      - echo "You have to provide tenant id, tenant title and optionally a description."
      - echo "===================================================="
      - echo ""
      - task: console
        vars: { EXEC_FLAGS: "-T", CLI_ARGS: "app:tenant:add" }

  user:add:
    desc: Add a new user — editor or admin (interactive)
    aliases: [user_add]
    cmds:
      - echo ""
      - echo "Add a user"
      - echo "===================================================="
      - echo "You have to provide email, password, full name, role (editor or admin) and the tenant id."
      - echo "===================================================="
      - echo ""
      - task: console
        vars: { EXEC_FLAGS: "-T", CLI_ARGS: "app:user:add" }

  templates:install:
    desc: Install bundled templates and screen layouts (--all --update)
    aliases: [load_templates]
    cmds:
      - task: console
        vars:
          {
            EXEC_FLAGS: "--user deploy",
            CLI_ARGS: "app:templates:install --all --update",
          }
      - task: console
        vars:
          {
            EXEC_FLAGS: "--user deploy",
            CLI_ARGS: "app:screen-layouts:install --all --update --cleanupRegions",
          }

  # -- Env-file bootstrap & tooling -------------------------------------------

  env:init:
    desc: |
      Single bootstrap entry point: creates .env (prompting for domain) +
      per-service .env.{php,nginx,mariadb,traefik} from their .example
      templates + .env.symfony extracted from the pinned API image.
      Auto-generates random APP_SECRET + JWT_PASSPHRASE and bumps
      DATABASE_URL serverVersion to match the mariadb image pinned in
      docker-compose.yml. Idempotent — re-running keeps operator-edited
      files. FORCE=1 to overwrite an existing .env.symfony (e.g. after
      bumping OS2DISPLAY_VERSION_API).
    cmds:
      - ./scripts/env-init.sh

  env:diff:
    desc: Compare .env.symfony against the example shipped in the current API image
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env missing — copy .env.example to .env first."
      - sh: "[ -f .env.symfony ]"
        msg: ".env.symfony missing — run 'task env:init' first."
    cmds:
      - |
        IMAGE="ghcr.io/os2display/display-api-service:${OS2DISPLAY_VERSION_API}"
        tmp=$(mktemp)
        docker run --rm --entrypoint sh "$IMAGE" -c 'cat /app/.env' > "$tmp"
        diff -u .env.symfony "$tmp" || true
        rm -f "$tmp"

  env:migrate:
    desc: Convert a 1.x .env.docker.local into a 3.x-shaped .env.symfony.migrated
    cmds:
      - |
        if [ -f .env.docker.local ]; then
          SRC=.env.docker.local
        elif [ -f .env.local ]; then
          SRC=.env.local
        else
          echo "Error: neither .env.docker.local nor .env.local exists."
          exit 1
        fi
        OUT=.env.symfony.migrated
        # Strip APP_ prefix from every key EXCEPT the framework-defined trio
        # (APP_ENV, APP_SECRET, APP_DEBUG) — Symfony recognises those by name,
        # and renaming them silently breaks env-driven debug/secret/env config.
        sed -E '/^APP_(ENV|SECRET|DEBUG)=/!s/^APP_([A-Z_][A-Z0-9_]*=)/\1/' "$SRC" > "$OUT"
        echo "Wrote $OUT (from $SRC)."
        echo "Review with: diff -u $SRC $OUT"
        echo "Apply with:  mv $OUT .env.symfony"
        echo ""
        echo "Note: this only contains Symfony app config. PHP_*, NGINX_*, MARIADB_*"
        echo "values from your old .env.docker.local belong in .env.php, .env.nginx,"
        echo "and .env.mariadb respectively — copy from the .example files"
        echo "and edit per your deployment."
        echo ""
        echo "Manual follow-ups (the script can't infer these):"
        echo "  - Strip any 1.x compose-orchestration block (COMPOSE_*, INTERNAL_*)"
        echo "    from the top of $OUT — those don't belong in .env.symfony."
        echo "    Move COMPOSE_PROJECT_NAME / COMPOSE_PROFILES to .env instead."
        echo "  - Rename per-site customisation keys to their v3 prefixes:"
        echo "      TOUCH_BUTTON_REGIONS    -> ADMIN_TOUCH_BUTTON_REGIONS"
        echo "      REJSEPLANEN_API_KEY     -> ADMIN_REJSEPLANEN_APIKEY"
        echo "      SHOW_SCREEN_STATUS      -> ADMIN_SHOW_SCREEN_STATUS"
        echo "      DATA_PULL_INTERVAL      -> CLIENT_PULL_STRATEGY_INTERVAL"
        echo "      SCHEDULING_INTERVAL     -> CLIENT_SCHEDULING_INTERVAL"

  env:traefik:
    desc: Setup .env.traefik (domain, email, dashboard auth) — interactive
    aliases: [traefik_env]
    cmds:
      - ./scripts/env-traefik.sh

  # -- Host inspection -------------------------------------------------------

  host:resources:
    desc: |
      Linux-only. Print a recommended compose override with mem_limit values
      for every service, derived from the host's CPU+RAM. Capture stdout to
      compose.resource-limits.yml and opt in via COMPOSE_FILE in .env.
      Assumes a DEDICATED host — scale down for shared hosts.
    cmds:
      - ./scripts/host-resources.sh

  host:php:
    desc: |
      Recommend PHP-FPM settings (pm.max_children, opcache memory, etc.) for
      a given os2display container mem_limit. Pass the limit in MiB after `--`:
          task host:php -- 256       # tight ceiling
          task host:php -- 1024      # comfortable mid-size
          task host:php -- 4096      # large
      Output: a block of PHP_* env-var assignments to merge into .env.php.
    cmds:
      - ./scripts/host-php.sh {{.CLI_ARGS}}

  host:disk:
    desc: Show stack disk usage (bind mounts + named volumes) plus host + docker totals
    cmds:
      - |
        echo "Bind mounts (host filesystem):"
        for path in ./media ./jwt ./backup; do
          if [ -d "$path" ]; then
            printf "  %-12s %s\n" "$path" "$(du -sh "$path" 2>/dev/null | cut -f1)"
          fi
        done
        echo
        echo "Named volumes (docker-managed):"
        PROJECT="${COMPOSE_PROJECT_NAME:-os2display}"
        docker system df -v 2>/dev/null \
          | awk -v p="^${PROJECT}_(mariadb|redis-data)" '$1 ~ p {printf "  %-30s %s\n", $1, $3}'
        echo
        echo "Host filesystem (project mount point — covers bind mounts):"
        df -h . | tail -1 | awk '{
          printf "  Total: %s   Used: %s   Available: %s   (%s used)\n", $2, $3, $4, $5
        }'
        echo
        # Docker-managed total (images + containers + volumes + build cache).
        # Same partition as the host on Linux; separately-allocated VM disk
        # on Docker Desktop (often the surprising bottleneck for named-volume
        # growth, default 60 GB on Mac).
        echo "Docker-managed storage (images + containers + volumes + build cache):"
        docker system df 2>/dev/null \
          | awk 'NR==1 || /^Images|^Containers|^Local Volumes|^Build Cache/ {printf "  %s\n", $0}'

  host:disk:tenants:
    desc: |
      Show ./media disk usage broken down by tenant. The v3 image's Vich
      uploader stores each tenant's uploads at ./media/<tenantKey>/, so the
      subdirectory names are the tenant keys.
    cmds:
      - |
        if [ ! -d ./media ] || [ -z "$(ls -A ./media 2>/dev/null)" ]; then
          echo "./media is empty or missing."
          exit 0
        fi
        echo "./media usage by tenant:"
        # Two-column output: <size>  <tenant-key>, sorted by size desc.
        # `du -sh` prints `<size>\t<path>`. We strip the trailing slash and
        # the leading ./media/ prefix to surface just the tenant key.
        du -sh ./media/*/ 2>/dev/null \
          | sort -hr \
          | awk -F'\t' '{
              path = $2
              sub(/\/$/, "", path)
              sub(/^\.\/media\//, "", path)
              printf "  %-30s %s\n", path, $1
            }'
        echo "  ----"
        printf "  %-30s %s\n" "TOTAL" "$(du -sh ./media 2>/dev/null | cut -f1)"

  # -- Database ---------------------------------------------------------------

  db:backup:
    desc: Dump the bundled MariaDB to ./backup/<UTC-timestamp>.sql.gz (online, --single-transaction)
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env missing — copy .env.example to .env first."
      - sh: "[ -f .env.mariadb ]"
        msg: ".env.mariadb missing — copy .env.mariadb.example to .env.mariadb first."
    cmds:
      - mkdir -p backup
      - |
        TS=$(date -u +%Y%m%dT%H%M%SZ)
        OUT="backup/${TS}.sql.gz"
        echo "Dumping all databases to $OUT (--single-transaction, no service downtime)..."
        {{.COMPOSE}} exec -T mariadb mariadb-dump \
          --all-databases --single-transaction --quick --routines --triggers --events \
          --user=root --password="$MARIADB_ROOT_PASSWORD" \
          | gzip > "$OUT"
        echo "Wrote $OUT ($(du -h "$OUT" | cut -f1))."

  db:upgrade:
    desc: Run mariadb-upgrade against the bundled MariaDB (idempotent; run after a major version bump)
    preconditions:
      - sh: "[ -f .env.mariadb ]"
        msg: ".env.mariadb missing — copy .env.mariadb.example to .env.mariadb first."
    cmds:
      - "{{.COMPOSE}} exec -T mariadb mariadb-upgrade --user=root --password=$MARIADB_ROOT_PASSWORD"

  db:metrics:
    desc: |
      Snapshot of MariaDB operational counters relevant to PHP-app-under-load
      symptoms: connection counts vs max, aborted connects/clients, InnoDB
      buffer-pool hit ratio, row-lock contention, slow queries, table opens,
      uptime. Use during incidents to triage symptoms; pair with `db:processes`
      for "what's running right now" and `db:errors` for log-side trouble.
    preconditions:
      - sh: "[ -f .env.mariadb ]"
        msg: ".env.mariadb missing — run 'task env:init' first."
    cmds:
      - ./scripts/db-metrics.sh

  db:processes:
    desc: Show MariaDB's full processlist — every active connection + the query each is running
    preconditions:
      - sh: "[ -f .env.mariadb ]"
        msg: ".env.mariadb missing — run 'task env:init' first."
    cmds:
      - "{{.COMPOSE}} exec -T mariadb mariadb --user=root --password=$MARIADB_ROOT_PASSWORD -e 'SHOW FULL PROCESSLIST'"

  db:errors:
    desc: |
      Filter the mariadb container's stderr for trouble patterns relevant to
      PHP-under-load: connection exhaustion, aborted connects, lock-wait
      timeouts, OOM, [ERROR]/[CRITICAL] entries. Defaults to last hour.
    cmds:
      - "{{.COMPOSE}} logs --no-color --since=1h mariadb 2>&1 | grep -iE '(too many connections|aborted connection|lock wait timeout|out of memory|got an error|\\[ERROR\\]|\\[CRITICAL\\])' || true"

  # -- Dev tooling ------------------------------------------------------------

  dev:lint:
    desc: Run all linters in check mode (Markdown + YAML + Shell + Tasks)
    deps:
      - dev:lint:md
      - dev:lint:yaml
      - dev:lint:sh
      - dev:lint:tasks

  dev:lint:fix:
    desc: Auto-fix all lint issues (Markdown + YAML; shellcheck has no fix mode)
    deps:
      - dev:lint:md:fix
      - dev:lint:yaml:fix

  dev:lint:md:
    desc: Lint Markdown files
    cmds:
      - docker compose --profile dev run --rm markdownlint markdownlint '**/*.md'

  dev:lint:md:fix:
    desc: Auto-fix Markdown lint issues (markdownlint --fix)
    cmds:
      - docker compose --profile dev run --rm markdownlint markdownlint --fix '**/*.md'

  dev:lint:yaml:
    desc: Lint YAML files (Prettier --check)
    cmds:
      - docker compose --profile dev run --rm prettier '**/*.{yml,yaml}' --check

  dev:lint:yaml:fix:
    desc: Auto-fix YAML formatting (Prettier --write)
    cmds:
      - docker compose --profile dev run --rm prettier '**/*.{yml,yaml}' --write

  dev:lint:sh:
    desc: Lint shell scripts in scripts/ via shellcheck (read-only; no auto-fix)
    cmds:
      - docker compose --profile dev run --rm shellcheck scripts/*.sh

  dev:lint:tasks:
    desc: |
      Assert the README's "All tasks" reference block lists every task
      `task --list` exposes (and vice versa). Set membership only —
      sectioning, descriptions, and ordering stay human-curated.
    cmds:
      - ./scripts/check-tasks-readme.sh

  dev:cert:
    desc: |
      Generate a self-signed certificate for local-host development. Writes
      traefik/ssl/dev.{crt,key}. Configure cert-file mode in .env.traefik
      afterwards (printed on success). Set FORCE=1 to overwrite.
    cmds:
      - ./scripts/dev-cert.sh

  dev:env:
    desc: |
      Bootstrap env files for localhost dev — non-interactive counterpart
      to `task env:init` + `task env:traefik`. Sets
      OS2DISPLAY_SERVER_DOMAIN=os2display.localhost and configures
      .env.traefik for cert-file mode with admin/admin dashboard auth
      (override via DEV_DASHBOARD_PASSWORD=... or DEV_DASHBOARD_USER=...,
      domains via DOMAIN=... DASH_DOMAIN=...). NOT FOR PRODUCTION.
    cmds:
      - ./scripts/dev-env.sh

  dev:install:
    desc: |
      Localhost dev quick start — `task dev:env`, `task dev:cert`,
      `task install` chained. Non-interactive through cert generation;
      `task install` still prompts for the initial tenant + admin user.
    cmds:
      # Each step is a fresh `task` subprocess so dotenv reloads between
      # them — `dev:env` mutates .env.traefik, and `dev:cert` + the
      # `install` precondition need to see the new values, not the
      # snapshot Task loaded when `dev:install` started. (Chained
      # `task: <name>` references run in the same process and inherit
      # the stale env.) FORCE=1 on dev:cert regenerates the cert so its
      # SANs match the domains dev:env just wrote.
      - task dev:env
      - FORCE=1 task dev:cert
      - task install

  dev:teardown:
    desc: |
      Tear down the dev stack to bare-checkout state: containers + named
      volumes (mariadb, redis), JWT keypair (./jwt/{private,public}.pem),
      dev cert (traefik/ssl/dev.{crt,key}), and the bootstrapped env
      files (.env, .env.{php,nginx,mariadb,traefik,symfony}). Operator
      `.env.*.local` overrides and ./media bind-mount uploads are
      preserved. Re-run `task dev:install` to bring up a fresh stack
      from scratch. Prompt-gated.
    prompt: |
      This will remove ALL containers AND named volumes (MariaDB +
      Redis — DATA WIPE), the JWT keypair, the dev cert, and ALL
      bootstrapped env files (.env, .env.<svc>, .env.symfony).
      Operator .env.*.local overrides and ./media uploads survive.
      Continue?
    cmds:
      # Plain `docker compose` (no --env-file flags) so teardown works even
      # if env files are missing or partially wiped. Compose falls back to
      # default `.env` discovery and the project-dir name.
      - docker compose down --volumes --remove-orphans
      # Cert + JWT keypair are written by transient containers
      # (alpine/openssl for the cert; the os2display container's UID 1042
      # `deploy` user via lexik:jwt:generate-keypair for the keypair). On
      # Linux hosts the files end up owned by container UIDs (root, 1042)
      # that the operator shell can't `rm` without matching the UID or
      # sudo. Docker Desktop on macOS / Windows brokers ownership at the
      # VM boundary so a host `rm` would work there, but routing through
      # a transient alpine container makes teardown portable across all
      # host platforms.
      - docker run --rm -v "$PWD:/work" alpine rm -f
        /work/traefik/ssl/dev.crt /work/traefik/ssl/dev.key
        /work/jwt/private.pem /work/jwt/public.pem
      # .env.* are host-written by env-init.sh (cp + sed) — host shell
      # owns them, so a plain `rm` works.
      - rm -f .env .env.php .env.nginx .env.mariadb .env.traefik .env.symfony
      - echo "Dev stack + bootstrapped state torn down. Run 'task dev:install' to bring it back up."

  # -- Internal ---------------------------------------------------------------

  show-notes:
    internal: true
    cmds:
      - |
        DOMAIN=$(grep ^OS2DISPLAY_SERVER_DOMAIN= .env | cut -d '=' -f 2)
        echo ""
        echo "===================================================="
        echo "OS2display now is available via the URLs below"
        echo "===================================================="
        echo "Admin: https://$DOMAIN/admin"
        echo "Screen: https://$DOMAIN/client"
        echo "===================================================="
