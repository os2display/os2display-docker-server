version: "3"
silent: true

vars:
  COMPOSE: docker compose --env-file .env --env-file .env.traefik

tasks:
  default:
    desc: The default task that shows help
    cmds:
      - echo "Available tasks (in preferred order):"
      - echo ""
      - echo "  Bootstrap"
      - echo "    env:init        Bootstrap .env.symfony from the API image"
      - echo "    env:diff        Compare .env.symfony to the example shipped in the image"
      - echo "    env:migrate     Convert a 2.x .env.docker.local to a 3.x .env.symfony"
      - echo "    traefik_env     Setup .env.traefik (domain, email, dashboard auth)"
      - echo ""
      - echo "  Lifecycle"
      - echo "    install         Install the project"
      - echo "    reinstall       Reinstall from scratch. WARNING Deletes the database!"
      - echo "    update          Pull updated images, recreate containers, run migrations"
      - echo "    up              Start the environment"
      - echo "    down            Remove all containers"
      - echo "    purge           Remove all containers and volumes. WARNING Deletes the database!"
      - echo "    stop            Stop all containers"
      - echo ""
      - echo "  Operations"
      - echo "    logs            Follow docker logs"
      - echo "    cc              Clear the cache"
      - echo "    tenant_add      Add a new tenant group"
      - echo "    user_add        Add a new user"
      - echo "    load_templates  Install bundled templates and screen layouts"
      - echo "    db:backup       Dump the bundled MariaDB to ./backup/<ts>.sql.gz"
      - echo "    db:upgrade      Run mariadb-upgrade (after a MariaDB major bump)"
      - echo ""

  install:
    desc: Install the project
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env missing — copy .env.example to .env, edit it, then re-run."
      - sh: "[ -f .env.symfony ]"
        msg: ".env.symfony missing — run 'task env:init' to bootstrap from the API image, edit it, then re-run."
    deps:
      - _env_files
    cmds:
      - echo "Installing"
      - "{{.COMPOSE}} pull"
      - "{{.COMPOSE}} up --force-recreate --detach --remove-orphans"
      - echo "Waiting for database to be ready"
      - sleep 20
      - echo "Run database migrations and required updates"
      - "{{.COMPOSE}} exec os2display bin/console app:update"
      - echo "Clearing the cache"
      - task cc
      - echo "Create jwt key pair"
      - "{{.COMPOSE}} exec os2display bin/console lexik:jwt:generate-keypair --skip-if-exists"
      - task tenant_add
      - echo "CREATE AN ADMIN USER. CHOOSE THE TENANT YOU JUST CREATED."
      - task user_add
      - task load_templates
      - task _show_notes

  traefik_env:
    desc: Setup .env.traefik (domain, email, dashboard auth)
    cmds:
      - |
        if [ ! -f .env.traefik ]; then
          echo ".env.traefik does not exist. Copying .env.traefik.production.example to .env.traefik..."
          cp .env.traefik.production.example .env.traefik
        fi

        # Ensure htpasswd is installed
        if ! command -v htpasswd >/dev/null 2>&1; then
          echo "Error: 'htpasswd' command not found."
          echo "Please install it (usually from the 'apache2-utils' or 'httpd-tools' package) and try again."
          exit 1
        fi

        echo ""

        echo "Configure Traefik environment"
        echo "===================================================="
        printf "Enter server domain (e.g. example.com): "
        read SERVER_DOMAIN
        printf "Enter email for Let's Encrypt (e.g. admin@example.com): "
        read TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL
        printf "Enter Traefik dashboard/admin username: "
        read SERVER_DASHBOARD_USERNAME
        printf "Enter Traefik dashboard/admin password: "
        read -s SERVER_DASHBOARD_PASSWORD

        # Generate htpasswd entry (username:hash)
        HTPASSWD_RAW=$(htpasswd -nb "${SERVER_DASHBOARD_USERNAME}" "${SERVER_DASHBOARD_PASSWORD}")

        # Escape characters that break sed/env ($, /, &)
        HTPASSWD_ESCAPED=$(printf '%s\n' "$HTPASSWD_RAW" \
          | sed -e 's/[\/&]/\\&/g' -e 's/\$/\\$/g')

        # Update variables in .env.traefik
        sed -i "s/^SERVER_DOMAIN=.*/SERVER_DOMAIN=${SERVER_DOMAIN}/" .env.traefik
        sed -i "s/^TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=.*/TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL}/" .env.traefik
        sed -i "s/^SERVER_DASHBOARD_AUTH=.*/SERVER_DASHBOARD_AUTH=${HTPASSWD_ESCAPED}/" .env.traefik

        echo "===================================================="
        echo ".env.traefik has been updated."
        echo "Domain:   ${SERVER_DOMAIN}"
        echo "Email:    ${TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL}"
        echo "User:     ${SERVER_DASHBOARD_USERNAME}"
        echo "Password: (hidden)"
        echo "Auth:     (htpasswd line stored in SERVER_DASHBOARD_AUTH)"
        echo "===================================================="

  env:init:
    desc: Bootstrap .env.symfony from the API image (run once on first install)
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env missing — copy .env.example to .env first."
      - sh: '! [ -f .env.symfony ] || [ "${FORCE:-0}" = "1" ]'
        msg: ".env.symfony already exists. Use 'task env:diff' to compare, or set FORCE=1 to overwrite."
    cmds:
      - |
        VERSION=$(grep ^OS2DISPLAY_VERSION_API= .env | cut -d= -f2)
        IMAGE="ghcr.io/os2display/display-api-service:${VERSION}"
        docker pull "$IMAGE"
        docker run --rm --entrypoint sh "$IMAGE" -c 'cat /var/www/html/.env' > .env.symfony
        echo ".env.symfony created from $IMAGE."
        echo "Edit it to set APP_SECRET, JWT_PASSPHRASE, DATABASE_URL, plus any ADMIN_* / CLIENT_* / OIDC_* overrides."
        echo "Then run 'task install'."

  env:diff:
    desc: Compare .env.symfony against the example shipped in the current API image
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env missing — copy .env.example to .env first."
      - sh: "[ -f .env.symfony ]"
        msg: ".env.symfony missing — run 'task env:init' first."
    cmds:
      - |
        VERSION=$(grep ^OS2DISPLAY_VERSION_API= .env | cut -d= -f2)
        IMAGE="ghcr.io/os2display/display-api-service:${VERSION}"
        tmp=$(mktemp)
        docker run --rm --entrypoint sh "$IMAGE" -c 'cat /var/www/html/.env' > "$tmp"
        diff -u .env.symfony "$tmp" || true
        rm -f "$tmp"

  env:migrate:
    desc: Convert a 2.x .env.docker.local into a 3.x-shaped .env.symfony.migrated (review, then mv into place)
    cmds:
      - |
        if [ -f .env.docker.local ]; then
          SRC=.env.docker.local
        elif [ -f .env.local ]; then
          SRC=.env.local
        else
          echo "Error: neither .env.docker.local nor .env.local exists."
          exit 1
        fi
        OUT=.env.symfony.migrated
        # Strip APP_ prefix from every key except APP_ENV and APP_SECRET (those stay).
        sed -E '/^APP_(ENV|SECRET)=/!s/^APP_([A-Z_][A-Z0-9_]*=)/\1/' "$SRC" > "$OUT"
        echo "Wrote $OUT (from $SRC)."
        echo "Review with: diff -u $SRC $OUT"
        echo "Apply with:  mv $OUT .env.symfony"
        echo "Note: this only contains Symfony app config. PHP_*, NGINX_*, MARIADB_*"
        echo "values from your old .env.docker.local belong in .env.php, .env.nginx,"
        echo "and .env.mariadb respectively — copy from the .production.example files"
        echo "and edit per your deployment."

  db:backup:
    desc: Dump the bundled MariaDB to ./backup/<timestamp>.sql.gz (online, --single-transaction)
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env missing — copy .env.example to .env first."
      - sh: "[ -f .env.local ]"
        msg: ".env.local missing — run 'task env:init' first."
    cmds:
      - mkdir -p backup
      - |
        ROOT_PASSWORD=$(grep ^MARIADB_ROOT_PASSWORD= .env.mariadb | cut -d= -f2-)
        if [ -z "$ROOT_PASSWORD" ]; then
          echo "Error: MARIADB_ROOT_PASSWORD is empty in .env.mariadb"
          exit 1
        fi
        TS=$(date -u +%Y%m%dT%H%M%SZ)
        OUT="backup/${TS}.sql.gz"
        echo "Dumping all databases to $OUT (--single-transaction, no service downtime)..."
        {{.COMPOSE}} exec -T mariadb mariadb-dump \
          --all-databases --single-transaction --quick --routines --triggers --events \
          --user=root --password="$ROOT_PASSWORD" \
          | gzip > "$OUT"
        echo "Wrote $OUT ($(du -h "$OUT" | cut -f1))."

  db:upgrade:
    desc: Run mariadb-upgrade against the bundled MariaDB (idempotent; run after a major version bump)
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env missing — copy .env.example to .env first."
    cmds:
      - |
        ROOT_PASSWORD=$(grep ^MARIADB_ROOT_PASSWORD= .env.mariadb | cut -d= -f2-)
        if [ -z "$ROOT_PASSWORD" ]; then
          echo "Error: MARIADB_ROOT_PASSWORD is empty in .env.mariadb"
          exit 1
        fi
        {{.COMPOSE}} exec -T mariadb mariadb-upgrade --user=root --password="$ROOT_PASSWORD"

  reinstall:
    desc: Reinstall from scratch. Removes the database, all containers, and volumes.
    deps:
      - purge
    cmds:
      - task install

  update:
    desc: Pull updated images, recreate containers, run migrations
    deps:
      - _env_files
    cmds:
      - "{{.COMPOSE}} pull"
      - "{{.COMPOSE}} up --force-recreate --detach --remove-orphans"
      - "{{.COMPOSE}} exec --user deploy os2display bin/console app:update"
      - echo "NB! Remember to load templates if they have changed (task load_templates)."

  down:
    desc: Remove all containers
    deps:
      - stop
    cmds:
      - "{{.COMPOSE}} down"

  purge:
    desc: Remove all containers and volumes
    deps:
      - stop
    cmds:
      - "{{.COMPOSE}} down --volumes --remove-orphans"

  up:
    desc: Take the environment up without altering the existing state of the containers
    deps:
      - _env_files
    cmds:
      - "{{.COMPOSE}} up -d"

  stop:
    desc: Stop all containers without altering anything else
    cmds:
      - "{{.COMPOSE}} stop"

  tenant_add:
    desc: Add a new tenant group
    cmds:
      - echo ""
      - echo "Add a tenant"
      - echo "===================================================="
      - echo "A tenant is a group of users that share the same configuration. F. ex. IT, Library, Schools etc."
      - echo "You have to provide tenant id, tenant title and optionally a description."
      - echo "===================================================="
      - echo ""
      - "{{.COMPOSE}} exec -T os2display bin/console app:tenant:add"

  user_add:
    desc: Add a new user (editor or admin)
    cmds:
      - echo ""
      - echo "Add a user"
      - echo "===================================================="
      - echo "You have to provide email, password, full name, role (editor or admin) and the tenant id."
      - echo "===================================================="
      - echo ""
      - "{{.COMPOSE}} exec -T os2display bin/console app:user:add"

  load_templates:
    desc: Install bundled templates and screen layouts (--all --update)
    cmds:
      - "{{.COMPOSE}} exec --user deploy os2display bin/console app:templates:install --all --update"
      - "{{.COMPOSE}} exec --user deploy os2display bin/console app:screen-layouts:install --all --update --cleanupRegions"

  logs:
    desc: Follow docker logs from the containers
    cmds:
      - "{{.COMPOSE}} logs -f --tail=50"

  cc:
    desc: Clear the cache
    cmds:
      - "{{.COMPOSE}} exec os2display bin/console cache:clear"

  _show_notes:
    cmds:
      - |
        DOMAIN=$(grep ^OS2DISPLAY_SERVER_DOMAIN= .env | cut -d '=' -f 2)
        echo ""
        echo "===================================================="
        echo "OS2display now is available via the URLs below"
        echo "===================================================="
        echo "Admin: https://$DOMAIN/admin"
        echo "Screen: https://$DOMAIN/client"
        echo "===================================================="

  _env_files:
    cmds:
      - |
        # Per-service env files bootstrap from their canonical .production.example
        # template if not yet edited by the operator. .env.symfony is image-
        # bootstrapped by `task env:init` and is not auto-created here.
        for svc in php nginx mariadb traefik; do
          if [ ! -f ".env.$svc" ]; then
            echo ".env.$svc does not exist. Copying .env.$svc.production.example to .env.$svc..."
            cp ".env.$svc.production.example" ".env.$svc"
          fi
        done
